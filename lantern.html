<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LANTERN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #070808;
      color: #c9c9c1;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    main {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .code {
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 0.35em;
      color: #555;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 48px;
      font-weight: normal;
      letter-spacing: 0.2em;
      margin: 0 0 35px;
    }

    .line {
      width: 60px;
      height: 1px;
      background: #444;
      margin: 0 auto 40px;
    }

    p {
      color: #777;
      line-height: 1.8;
      font-size: 15px;
    }

    .numbers {
      margin-top: 55px;
      font-family: monospace;
      color: #555;
      letter-spacing: 0.3em;
    }

    .final {
      margin-top: 70px;
      font-family: monospace;
      font-size: 11px;
      color: #333;
    }
  </style>
</head>

<body>

  <main>

    <div class="code">
      LANTERN // 01
    </div>

    <h1>YOU FOUND THE DOOR.</h1>

    <div class="line"></div>

    <p>
      Most people stopped at the first message.
    </p>

    <p>
      You didn't.
    </p>

    <p>
      The next signal is not written in words.
    </p>

    <div class="numbers">
      20 / 8 / 5 / 18 / 5
    </div>

    <div class="final">
      THE SECOND DOOR IS CLOSER THAN IT LOOKS.
    </div>

  </main>

  <!--
    LANTERN // SECOND SIGNAL

    20 8 5 18 5

    The answer is not a place.
    It is an instruction.

    Look carefully.
  -->

</body>
</html>
