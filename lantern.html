<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LANTERN // 01</title>

  <style>
    :root {
      --night: #070808;
      --ash: #c9c9c1;
      --dim: #777;
      --faint: #333;

      --one: 17;
      --two: 3;
      --three: 14;
      --four: 20;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--night);
      color: var(--ash);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    main {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .code {
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 0.35em;
      color: #555;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 48px;
      font-weight: normal;
      letter-spacing: 0.2em;
      margin: 0 0 35px;
    }

    .line {
      width: 60px;
      height: 1px;
      background: #444;
      margin: 0 auto 40px;
    }

    p {
      color: var(--dim);
      line-height: 1.8;
      font-size: 15px;
    }

    .numbers {
      margin-top: 55px;
      font-family: monospace;
      color: #555;
      letter-spacing: 0.3em;
    }

    .final {
      margin-top: 70px;
      font-family: monospace;
      font-size: 11px;
      color: var(--faint);
    }

    /*
      Nothing important here.
      The page is only what it appears to be.
    */

    .ordinary {
      display: none;
    }
  </style>
</head>

<body>

  <main data-lantern="17">

    <div class="code">
      LANTERN // 01
    </div>

    <h1>YOU FOUND THE DOOR.</h1>

    <div class="line"></div>

    <p>
      Most people stopped at the first message.
    </p>

    <p>
      You didn't.
    </p>

    <p>
      The next signal is not written in words.
    </p>

    <div class="numbers">
      20 / 8 / 5 / 18 / 5
    </div>

    <div class="final">
      THE SECOND DOOR IS CLOSER THAN IT LOOKS.
    </div>

    <div class="ordinary"
         data-a="4"
         data-b="15"
         data-c="18"
         data-d="5"
         aria-hidden="true">
    </div>

  </main>

  <!--
  ============================================================
  LANTERN // SECOND SIGNAL
  ============================================================

  You looked below.

  That was correct.

  But looking is not the same as seeing.

  Four numbers are waiting.
  They are not in the obvious place.

  The page has four silent witnesses.

  Find them.

  ============================================================
  -->

</body>
</html>
