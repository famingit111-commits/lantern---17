<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LANTERN // 02</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #070808;
      color: #c9c9c1;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    main {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .code {
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 0.35em;
      color: #555;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 46px;
      font-weight: normal;
      letter-spacing: 0.18em;
      margin: 0 0 35px;
    }

    .line {
      width: 60px;
      height: 1px;
      background: #444;
      margin: 0 auto 40px;
    }

    p {
      color: #777;
      line-height: 1.9;
      font-size: 15px;
    }

    .numbers {
      margin-top: 55px;
      font-family: monospace;
      font-size: 18px;
      color: #555;
      letter-spacing: 0.4em;
    }

    .final {
      margin-top: 70px;
      font-family: monospace;
      font-size: 11px;
      color: #333;
      letter-spacing: 0.15em;
    }

    .silent {
      display: none;
    }

    :root {
      --a: 6;
      --b: 9;
      --c: 14;
      --d: 1;
      --e: 12;
    }
  </style>
</head>

<body>

  <main data-lantern="17">

    <div class="code">
      LANTERN // 02
    </div>

    <h1>THERE.</h1>

    <div class="line"></div>

    <p>
      You found the first door.
    </p>

    <p>
      But “there” is not a location.
    </p>

    <p>
      It is a direction.
    </p>

    <div class="numbers">
      20 / 8 / 5 / 18 / 5
    </div>

    <div class="final">
      THE SECOND DOOR IS CLOSER THAN IT LOOKS.
    </div>

    <div
      class="silent"
      data-one="6"
      data-two="9"
      data-three="14"
      data-four="1"
      data-five="12"
      aria-hidden="true">
    </div>

  </main>

  <!--
  ============================================================

  LANTERN // SECOND SIGNAL

  You looked below.

  That was correct.

  But looking is not the same as seeing.

  Five silent witnesses are hidden in the page.

  They are numbers.

  A=1.

  Their order is not written beside them.

  Find the order.

  When the five letters make sense,
  they will tell you what to open.

  ============================================================
  -->

</body>
</html>
